name = "weblack"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

# Non sensibles — déjà publics (le site les expose lui-même côté client à
# chaque requête Sanity). Nécessaires ici explicitement : la présence de ce
# fichier fait passer Cloudflare Pages en résolution de variables pilotée
# par wrangler.toml, ce qui a cessé de lire les variables jusqu'ici
# configurées dans le dashboard (constaté : build en échec, "SANITY_PROJECT_ID
# / SANITY_DATASET not set", alors qu'aucun code n'y touchait).
[vars]
SANITY_PROJECT_ID = "pzpm4xjp"
SANITY_DATASET = "production"
# Expéditeur des e-mails de candidature (functions/lib/talentOutbox.ts).
# Pas un secret : c'est l'adresse visible par le destinataire. Le domaine
# weblack.fr porte la clé DKIM Resend (resend._domainkey.weblack.fr) ; si
# Resend refusait l'envoi, le refus est consigné dans email_outbox et visible
# dans l'administration — la candidature, elle, reste enregistrée. La clé API
# reste le secret NEWSLETTER_API_KEY, jamais ici.
RESEND_FROM = "WEBLACK TALENTS <talents@weblack.fr>"

# Dossiers de candidature Talent — jamais dans le dataset Sanity public
# (lisible anonymement, voir editorial-engine/EDITORIAL_ENGINE.md / audit
# Agenda). D1 pour les données, KV pour les photos (R2 non activé sur ce
# compte au moment de l'implémentation — migration triviale le jour venu,
# voir functions/lib/photos.ts).
[[d1_databases]]
binding = "DB"
database_name = "weblack-talent-applications"
database_id = "7bc900c3-e38b-4ead-842e-97f629b30202"

[[kv_namespaces]]
binding = "PHOTOS"
id = "e31fd4cefea0458cae8511ae59d1a737"
